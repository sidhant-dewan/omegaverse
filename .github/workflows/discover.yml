name: Discover catalog candidates

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: shakchiverse-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Discover and score candidates
        run: npm run catalog:daily
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      - name: Open candidate review pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update discovery candidates"
          branch: automation/shakchiverse-candidates
          delete-branch: true
          title: "Catalog candidate review"
          body: |
            Automated candidate discovery output. Review `data/candidate-report.md` and official sources.

            Approving this PR does not publish candidates. Move verified references to `data/catalog.json` manually.
          labels: catalog-review
